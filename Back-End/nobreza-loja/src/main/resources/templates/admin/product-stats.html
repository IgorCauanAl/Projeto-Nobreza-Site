<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Estatísticas de Produtos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }
        .container {
            margin-top: 50px;
        }
        .card {
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        .table th {
            background-color: #343a40;
            color: white;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <div class="card-header bg-primary text-white">
            <h3 class="mb-0">Produtos Mais Acessados</h3>
        </div>
        <div class="card-body">
            <table class="table table-striped table-hover">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Nome do Produto</th>
                    <th>Referência</th>
                    <th>Preço</th>
                    <th>Acessos</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="product, iterStat : ${products}">
                    <td th:text="${iterStat.count}">1</td>
                    <td th:text="${product.name}">Nome do Produto</td>
                    <td th:text="${product.referencia}">REF123</td>
                    <td th:text="${'R$ ' + product.price}">R$ 100.00</td>
                    <td>
                        <span class="badge bg-success rounded-pill" th:text="${product.accessCount}">0</span>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
