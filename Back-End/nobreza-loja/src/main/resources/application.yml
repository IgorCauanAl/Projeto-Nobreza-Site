server:
  port: 8081

spring:
  datasource:
    url: ${DB_URL}
    username: sa
    password: 1234567
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
    show-sql: true
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB
      file-size-threshold: 1MB
      location: ${java.io.tmpdir:/tmp}
  devtools:
    restart:
      enabled: false
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_REMETENTE}
    password: ${EMAIL_SENHA}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  ai:
    ollama:
      base-url: http://localhost:11434
      chat:
        model: llama3.2:3b
        options:
          temperature: 0.7

logging:
  file:
    name: logs/product-access.log
  level:
    root: INFO
    commerce.nobreza.loja.masculina.nobreza_loja.Service.ProductAccessLogService: INFO
