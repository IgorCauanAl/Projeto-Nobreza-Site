server:
  port: 8081

error:
  whitelabel:
    enabled: false

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/nobreza_db?useSSL=false&serverTimezone=UTC
    username: nobreza_user
    password: admsupremo150301#$%
    driver-class-name: com.mysql.cj.jdbc.Driver

  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 20MB
      file-size-threshold: 1MB
      location: ${java.io.tmpdir:/tmp}


  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MariaDBDialect
        format_sql: true
        envers:
          audit_table_suffix: _AUD
          store_data_at_delete: true
    show-sql: true



  mail:
    host: smtp.gmail.com
    port: 587
    username: ${EMAIL_REMETENTE}
    password: ${EMAIL_SENHA}
    protocol: smtp
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true



